<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Акт проверки узла учета</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 12px; margin: 0; color: #1c1e21; }
    .card { background: #fff; padding: 14px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 12px; }
    h3 { margin-top: 0; color: #0088cc; font-size: 15px; border-bottom: 2px solid #e4e6eb; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    h4 { margin: 10px 0 6px 0; color: #4b4f56; font-size: 13px; text-decoration: underline; }
    label { font-size: 12px; font-weight: 600; color: #606770; display: block; margin-top: 8px; margin-bottom: 3px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccd0d5; border-radius: 8px; box-sizing: border-box; font-size: 13px; background: #fff; }
    input:focus, select:focus { border-color: #0088cc; outline: none; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .hidden { display: none !important; }
    
    .toggle-group { display: flex; align-items: center; justify-content: space-between; background: #f7f8fa; padding: 10px 12px; border-radius: 8px; margin-top: 8px; border: 1px solid #e4e6eb; }
    .toggle-group label { margin: 0; font-size: 13px; cursor: pointer; color: #1c1e21; font-weight: 500; }
    .toggle-group input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; transform: scale(1.3); }

    .btn-submit { width: 100%; background: #24a1de; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; box-shadow: 0 2px 6px rgba(36,161,222,0.3); }
    .btn-submit:active { background: #1d82b3; }
    .section-divider { border: 0; border-top: 1px dashed #ccc; margin: 12px 0; }
  </style>
</head>
<body>

<form id="actForm">

  <!-- 1. ШАПКА АКТА -->
  <div class="card">
    <h3>1. Общие данные</h3>
    <div class="row">
      <div><label>Дата</label><input type="date" id="actDate" required></div>
      <div><label>Время</label><input type="time" id="actTime" required></div>
    </div>
    <div class="row">
      <div><label>№ Акта</label><input type="text" id="actNum" placeholder="НО 36875" required></div>
      <div>
        <label>Вид ресурса</label>
        <select id="resourceType" onchange="toggleResourceType()">
          <option value="Тепловая энергия">Тепловая энергия</option>
          <option value="ГВС">ГВС</option>
          <option value="ХВС">ХВС</option>
        </select>
      </div>
    </div>
    <label>Потребитель / Объект</label>
    <input type="text" id="consumer" placeholder="Гулиев Асиф Камран Оглы, адм. здание">
    
    <div class="row">
      <div><label>№ Договора</label><input type="text" id="docNum" placeholder="НФ00ТВ0000011047"></div>
      <div><label>Основание</label><input type="text" id="reason" value="по заявлению абонента"></div>
    </div>
    
    <label>Адрес объекта</label>
    <input type="text" id="address" placeholder="г. Ноябрьск, ул. Ленина, д. 17А" required>

    <label>Представитель потребителя (ФИО, должн., тел.)</label>
    <input type="text" id="consumerRep">
  </div>

  <!-- 2. ТЕПЛОВЫЧИСЛИТЕЛЬ -->
  <div class="card" id="calcSection">
    <h3>2. Вычислитель</h3>
    <div class="row">
      <div><label>Тип прибора</label><input type="text" id="calcType" placeholder="СПТ-944"></div>
      <div><label>Заводской №</label><input type="text" id="calcSn" placeholder="01670"></div>
    </div>
    
    <div class="row">
      <div><label>Q (Гкал)</label><input type="number" step="0.001" id="calcQ" placeholder="0.94"></div>
      <div><label>T раб. (ч)</label><input type="number" id="calcTrab" placeholder="2733"></div>
      <div><label>T нешт. (ч)</label><input type="number" id="calcTnesht" placeholder="—"></div>
    </div>
    <div class="row">
      <div><label>Среднечас. Q (Гкал/ч)</label><input type="text" id="calcQavg" placeholder="—"></div>
      <div><label>Поверка (Аршин)</label><input type="date" id="calcPov"></div>
    </div>
    <label>№ пломбы РСО</label>
    <input type="text" id="calcSeal" placeholder="0037100">
  </div>

  <!-- 3. РАСХОДОМЕРЫ (ПР) -->
  <div class="card">
    <h3>3. Расходомеры (ПР)</h3>
    
    <!-- Подающий ПР (Обязательный) -->
    <h4>Подающий трубопровод</h4>
    <div class="row">
      <div><label>Тип прибора</label><input type="text" id="prInType" placeholder="ВЭПС-Р-ПБ2-01"></div>
      <div><label>Ду (мм)</label><input type="number" id="prInDu" placeholder="25"></div>
      <div><label>Заводской №</label><input type="text" id="prInSn" placeholder="7255629"></div>
    </div>
    <div class="row">
      <div><label>Нарастающий (м³)</label><input type="number" step="0.01" id="prInVal" placeholder="49"></div>
      <div><label>Среднечас. (м³/ч)</label><input type="number" step="0.01" id="prInAvg" placeholder="0.48"></div>
    </div>
    <div class="row">
      <div><label>Поверка (Аршин)</label><input type="date" id="prInPov"></div>
      <div><label>№ пломбы РСО</label><input type="text" id="prInSeal" placeholder="0044666"></div>
    </div>

    <!-- ТУМБЛЕР ДЛЯ ВТОРОГО РАСХОДОМЕРА -->
    <div id="prOutToggleGroup" class="toggle-group">
      <label for="hasPrOut" id="lblHasPrOut">Есть второй расходомер (Обратка/Циркуляция)</label>
      <input type="checkbox" id="hasPrOut" checked onchange="togglePrOut()">
    </div>

    <!-- Второй расходомер -->
    <div id="prOutBlock">
      <hr class="section-divider">
      <h4 id="prOutTitle">Обратный трубопровод</h4>
      <div class="row">
        <div><label>Тип прибора</label><input type="text" id="prOutType" placeholder="ВЭПС-Р-ПБ2-01"></div>
        <div><label>Ду (мм)</label><input type="number" id="prOutDu" placeholder="25"></div>
        <div><label>Заводской №</label><input type="text" id="prOutSn" placeholder="7255544"></div>
      </div>
      <div class="row">
        <div><label>Нарастающий (м³)</label><input type="number" step="0.01" id="prOutVal" placeholder="50"></div>
        <div><label>Среднечас. (м³/ч)</label><input type="number" step="0.01" id="prOutAvg" placeholder="0.44"></div>
      </div>
      <div class="row">
        <div><label>Поверка (Аршин)</label><input type="date" id="prOutPov"></div>
        <div><label>№ пломбы РСО</label><input type="text" id="prOutSeal" placeholder="0044667"></div>
      </div>
    </div>
  </div>

  <!-- 4. ТЕРМОПРЕОБРАЗОВАТЕЛИ -->
  <div class="card" id="tempSection">
    <h3>4. Комплект термопреобразователей</h3>
    <div class="row">
      <div><label>Тип комплекта</label><input type="text" id="ktpType" placeholder="КТПТР-06"></div>
      <div><label>Зав. № (Подача)</label><input type="text" id="ktpInSn" placeholder="910"></div>
      <div><label>Зав. № (Обр./Цирк.)</label><input type="text" id="ktpOutSn" placeholder="910 A"></div>
    </div>
    <div class="row">
      <div><label>Замер T под. (°C)</label><input type="number" step="0.1" id="ktpInT" placeholder="69"></div>
      <div><label>Замер T обр. (°C)</label><input type="number" step="0.1" id="ktpOutT" placeholder="52"></div>
    </div>
    <div class="row">
      <div><label>Среднечас. T под.</label><input type="number" step="0.1" id="ktpInTavg" placeholder="69"></div>
      <div><label>Среднечас. T обр.</label><input type="number" step="0.1" id="ktpOutTavg" placeholder="52"></div>
    </div>
    <div class="row">
      <div><label>Поверка (Аршин)</label><input type="date" id="ktpPov"></div>
    </div>
    <div class="row">
      <div><label>Пломба РСО (Под.)</label><input type="text" id="ktpInSeal" placeholder="0044668"></div>
      <div><label>Пломба РСО (Обр.)</label><input type="text" id="ktpOutSeal" placeholder="0044669"></div>
    </div>
  </div>

  <!-- 5. СХЕМА И ИМПУЛЬСЫ -->
  <div class="card" id="schemeSection">
    <h3>5. Схема и вес импульса</h3>
    <div class="row">
      <div><label>Схема потребления</label><input type="text" id="schemeFormula" placeholder="СП-03"></div>
    </div>
    <label>Вес импульса в вычислителе (м³/имп)</label>
    <input type="text" id="impCalc" placeholder="по под. 0.001 / по обр. 0.001">
    <label>Вес импульса в расходомере (м³/имп)</label>
    <input type="text" id="impPr" placeholder="по под. 0.001 / по обр. 0.001">
  </div>

  <!-- 6. ВАРИАТИВНОЕ ОБОРУДОВАНИЕ -->
  <div class="card">
    <h3>6. Дополнительное оборудование</h3>
    
    <!-- ТУМБЛЕР ДАТЧИКОВ ДАВЛЕНИЯ -->
    <div class="toggle-group">
      <label for="hasPressure">Датчики давления (Подача / Обратка)</label>
      <input type="checkbox" id="hasPressure" checked onchange="togglePressure()">
    </div>

    <!-- Блок датчиков давления -->
    <div id="pressBlock" style="margin-top: 10px;">
      <h4>Подающий трубопровод (P1)</h4>
      <div class="row">
        <div><label>Тип</label><input type="text" id="pressInType" placeholder="СДВ-И"></div>
        <div><label>Зав. №</label><input type="text" id="pressInSn" placeholder="245310"></div>
      </div>
      <div class="row">
        <div><label>Поверка</label><input type="date" id="pressInPov"></div>
        <div><label>Показания (кгс/см²)</label><input type="number" step="0.1" id="pressInVal" placeholder="6.1"></div>
        <div><label>Пломба</label><input type="text" id="pressInSeal" placeholder="0044670"></div>
      </div>

      <div id="pressOutGroup">
        <hr class="section-divider">
        <h4>Обратный трубопровод (P2)</h4>
        <div class="row">
          <div><label>Тип</label><input type="text" id="pressOutType" placeholder="СДВ-И"></div>
          <div><label>Зав. №</label><input type="text" id="pressOutSn" placeholder="245366"></div>
        </div>
        <div class="row">
          <div><label>Поверка</label><input type="date" id="pressOutPov"></div>
          <div><label>Показания (кгс/см²)</label><input type="number" step="0.1" id="pressOutVal" placeholder="6.1"></div>
          <div><label>Пломба</label><input type="text" id="pressOutSeal" placeholder="0044661"></div>
        </div>
      </div>
    </div>

    <hr class="section-divider">

    <!-- ТУМБЛЕР ПОДПИТКИ -->
    <div class="toggle-group">
      <label for="hasMakeUp">Подпиточный трубопровод (Независимая схема)</label>
      <input type="checkbox" id="hasMakeUp" onchange="toggleMakeUp()">
    </div>

    <!-- Блок подпитки -->
    <div id="makeUpBlock" class="hidden" style="margin-top: 10px;">
      <h4>Расходомер подпитки</h4>
      <div class="row">
        <div><label>Тип ПР подпитки</label><input type="text" id="makeUpType" placeholder="ВЭПС"></div>
        <div><label>Зав. №</label><input type="text" id="makeUpSn"></div>
      </div>
      <div class="row">
        <div><label>Поверка</label><input type="date" id="makeUpPov"></div>
        <div><label>Показания (м³)</label><input type="number" step="0.01" id="makeUpVal"></div>
        <div><label>Пломба РСО</label><input type="text" id="makeUpSeal"></div>
      </div>

      <!-- Разделенные тумблеры для давления и температуры на подпитке -->
      <div class="toggle-group" style="margin-top: 8px; background: #fff;">
        <label for="hasMakeUpPress" style="font-size: 12px;">+ Датчик давления на подпитке (Pподп)</label>
        <input type="checkbox" id="hasMakeUpPress" onchange="toggleMakeUpSensors()">
      </div>
      <div id="makeUpPressBlock" class="hidden" style="margin-top: 6px;">
        <div class="row">
          <div><label>Тип прибора</label><input type="text" id="makeUpPressType" placeholder="СДВ-И"></div>
          <div><label>Зав. №</label><input type="text" id="makeUpPressSn"></div>
        </div>
        <div class="row">
          <div><label>Показания (кгс/см²)</label><input type="number" step="0.1" id="makeUpPressVal" placeholder="4.0"></div>
          <div><label>Поверка</label><input type="date" id="makeUpPressPov"></div>
          <div><label>Пломба</label><input type="text" id="makeUpPressSeal"></div>
        </div>
      </div>

      <div class="toggle-group" style="margin-top: 8px; background: #fff;">
        <label for="hasMakeUpTemp" style="font-size: 12px;">+ Термопреобразователь на подпитке (Tподп)</label>
        <input type="checkbox" id="hasMakeUpTemp" onchange="toggleMakeUpSensors()">
      </div>
      <div id="makeUpTempBlock" class="hidden" style="margin-top: 6px;">
        <div class="row">
          <div><label>Тип прибора</label><input type="text" id="makeUpTempType" placeholder="КТПТР"></div>
          <div><label>Зав. №</label><input type="text" id="makeUpTempSn"></div>
        </div>
        <div class="row">
          <div><label>Замер T (°C)</label><input type="number" step="0.1" id="makeUpTempVal" placeholder="15"></div>
          <div><label>Поверка</label><input type="date" id="makeUpTempPov"></div>
          <div><label>Пломба</label><input type="text" id="makeUpTempSeal"></div>
        </div>
      </div>

    </div>

  </div>

  <!-- 7. ЗАКЛЮЧЕНИЕ -->
  <div class="card">
    <h3>7. Заключение и подписи</h3>
    <label>Узел учета считается:</label>
    <select id="status">
      <option value="пригодным">Пригодным для коммерческого учета</option>
      <option value="непригодным">Непригодным</option>
    </select>

    <label>Срок действия пригодности (до):</label>
    <input type="date" id="statusUntilDate">

    <label>Представитель РСО (Инспектор)</label>
    <div class="row">
      <div><input type="text" id="inspectorPost" value="инженер технической инспекции"></div>
      <div><input type="text" id="inspectorFio" placeholder="Щербинин Б.С." required></div>
    </div>
  </div>

  <button type="button" class="btn-submit" onclick="sendData()">Сформировать и отправить акт</button>
</form>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  document.getElementById('actDate').valueAsDate = new Date();
  const now = new Date();
  document.getElementById('actTime').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

  function toggleResourceType() {
    const res = document.getElementById('resourceType').value;
    const isHvs = (res === 'ХВС');
    const isGvs = (res === 'ГВС');

    document.getElementById('calcSection').classList.toggle('hidden', isHvs);
    document.getElementById('tempSection').classList.toggle('hidden', isHvs);
    document.getElementById('schemeSection').classList.toggle('hidden', isHvs);

    document.getElementById('prOutToggleGroup').classList.toggle('hidden', isHvs);
    if (isHvs) {
      document.getElementById('hasPrOut').checked = false;
    } else {
      document.getElementById('hasPrOut').checked = true;
    }
    togglePrOut();

    document.getElementById('prOutTitle').innerText = isGvs ? "Циркуляционный трубопровод" : "Обратный трубопровод";
  }

  function togglePrOut() {
    const checked = document.getElementById('hasPrOut').checked;
    document.getElementById('prOutBlock').classList.toggle('hidden', !checked);
  }

  function togglePressure() {
    const checked = document.getElementById('hasPressure').checked;
    document.getElementById('pressBlock').classList.toggle('hidden', !checked);
  }

  function toggleMakeUp() {
    const checked = document.getElementById('hasMakeUp').checked;
    document.getElementById('makeUpBlock').classList.toggle('hidden', !checked);
  }

  function toggleMakeUpSensors() {
    const hasPress = document.getElementById('hasMakeUpPress').checked;
    const hasTemp = document.getElementById('hasMakeUpTemp').checked;
    
    document.getElementById('makeUpPressBlock').classList.toggle('hidden', !hasPress);
    document.getElementById('makeUpTempBlock').classList.toggle('hidden', !hasTemp);
  }

  function sendData() {
    const formData = {
      actDate: document.getElementById('actDate').value,
      actTime: document.getElementById('actTime').value,
      actNum: document.getElementById('actNum').value,
      resourceType: document.getElementById('resourceType').value,
      consumer: document.getElementById('consumer').value,
      docNum: document.getElementById('docNum').value,
      reason: document.getElementById('reason').value,
      address: document.getElementById('address').value,
      consumerRep: document.getElementById('consumerRep').value,

      calcType: document.getElementById('calcType').value,
      calcSn: document.getElementById('calcSn').value,
      calcQ: document.getElementById('calcQ').value,
      calcTrab: document.getElementById('calcTrab').value,
      calcTnesht: document.getElementById('calcTnesht').value,
      calcQavg: document.getElementById('calcQavg').value,
      calcPov: document.getElementById('calcPov').value,
      calcSeal: document.getElementById('calcSeal').value,

      prInType: document.getElementById('prInType').value,
      prInDu: document.getElementById('prInDu').value,
      prInSn: document.getElementById('prInSn').value,
      prInVal: document.getElementById('prInVal').value,
      prInAvg: document.getElementById('prInAvg').value,
      prInPov: document.getElementById('prInPov').value,
      prInSeal: document.getElementById('prInSeal').value,

      hasPrOut: document.getElementById('hasPrOut').checked,
      prOutType: document.getElementById('prOutType').value,
      prOutDu: document.getElementById('prOutDu').value,
      prOutSn: document.getElementById('prOutSn').value,
      prOutVal: document.getElementById('prOutVal').value,
      prOutAvg: document.getElementById('prOutAvg').value,
      prOutPov: document.getElementById('prOutPov').value,
      prOutSeal: document.getElementById('prOutSeal').value,

      ktpType: document.getElementById('ktpType').value,
      ktpInSn: document.getElementById('ktpInSn').value,
      ktpOutSn: document.getElementById('ktpOutSn').value,
      ktpInT: document.getElementById('ktpInT').value,
      ktpOutT: document.getElementById('ktpOutT').value,
      ktpInTavg: document.getElementById('ktpInTavg').value,
      ktpOutTavg: document.getElementById('ktpOutTavg').value,
      ktpPov: document.getElementById('ktpPov').value,
      ktpInSeal: document.getElementById('ktpInSeal').value,
      ktpOutSeal: document.getElementById('ktpOutSeal').value,

      schemeFormula: document.getElementById('schemeFormula').value,
      impCalc: document.getElementById('impCalc').value,
      impPr: document.getElementById('impPr').value,

      hasPressure: document.getElementById('hasPressure').checked,
      pressInType: document.getElementById('pressInType').value,
      pressInSn: document.getElementById('pressInSn').value,
      pressInPov: document.getElementById('pressInPov').value,
      pressInVal: document.getElementById('pressInVal').value,
      pressInSeal: document.getElementById('pressInSeal').value,

      pressOutType: document.getElementById('pressOutType').value,
      pressOutSn: document.getElementById('pressOutSn').value,
      pressOutPov: document.getElementById('pressOutPov').value,
      pressOutVal: document.getElementById('pressOutVal').value,
      pressOutSeal: document.getElementById('pressOutSeal').value,

      hasMakeUp: document.getElementById('hasMakeUp').checked,
      makeUpType: document.getElementById('makeUpType').value,
      makeUpSn: document.getElementById('makeUpSn').value,
      makeUpPov: document.getElementById('makeUpPov').value,
      makeUpVal: document.getElementById('makeUpVal').value,
      makeUpSeal: document.getElementById('makeUpSeal').value,

      hasMakeUpPress: document.getElementById('hasMakeUpPress').checked,
      makeUpPressType: document.getElementById('makeUpPressType').value,
      makeUpPressSn: document.getElementById('makeUpPressSn').value,
      makeUpPressVal: document.getElementById('makeUpPressVal').value,
      makeUpPressPov: document.getElementById('makeUpPressPov').value,
      makeUpPressSeal: document.getElementById('makeUpPressSeal').value,

      hasMakeUpTemp: document.getElementById('hasMakeUpTemp').checked,
      makeUpTempType: document.getElementById('makeUpTempType').value,
      makeUpTempSn: document.getElementById('makeUpTempSn').value,
      makeUpTempVal: document.getElementById('makeUpTempVal').value,
      makeUpTempPov: document.getElementById('makeUpTempPov').value,
      makeUpTempSeal: document.getElementById('makeUpTempSeal').value,

      status: document.getElementById('status').value,
      statusUntilDate: document.getElementById('statusUntilDate').value,
      inspectorPost: document.getElementById('inspectorPost').value,
      inspectorFio: document.getElementById('inspectorFio').value
    };

    tg.sendData(JSON.stringify(formData));
  }
</script>
</body>
</html>
